<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tetris Mobile</title>
    <style>
        body { margin:0; padding:0; background:#000; color:#fff; font-family:Arial, sans-serif; overflow:hidden; touch-action: none; }
        #game-container { display:flex; flex-direction:column; height:100vh; }
        canvas { background:#111; display:block; margin:0 auto; image-rendering: pixelated; }
        .controls {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; background: #222;
        }
        button {
            padding: 15px; font-size: 18px; background: #333; color: white; border: none; border-radius: 8px;
            touch-action: manipulation;
        }
        .info { text-align:center; padding:10px; background:#111; }
        .swipe-zone { position:absolute; top:0; left:0; width:100%; height:70%; z-index:10; }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="info">
            <h1>TETRIS</h1>
            <div>Score: <span id="score">0</span> | Niveau: <span id="level">1</span></div>
        </div>
        <canvas id="game" width="240" height="480"></canvas>
        
        <div class="controls">
            <button id="left">←</button>
            <button id="rotate">↻</button>
            <button id="right">→</button>
            <button id="down">↓</button>
            <button id="harddrop" style="grid-column: span 4;">HARD DROP</button>
            <button id="pause" style="grid-column: span 2;">Pause</button>
            <button id="restart" style="grid-column: span 2;">Restart</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const grid = 24;
        const cols = 10, rows = 20;
        let score = 0, level = 1, linesCleared = 0;
        let dropInterval = 800;
        let lastDrop = Date.now();

        let board = Array.from({length: rows}, () => Array(cols).fill(0));
        let piece = null;

        const tetrominos = {
            I: { shape: [[1,1,1,1]], color: '#0ff' },
            O: { shape: [[1,1],[1,1]], color: '#ff0' },
            T: { shape: [[0,1,0],[1,1,1]], color: '#f0f' },
            S: { shape: [[0,1,1],[1,1,0]], color: '#0f0' },
            Z: { shape: [[1,1,0],[0,1,1]], color: '#f00' },
            J: { shape: [[1,0,0],[1,1,1]], color: '#00f' },
            L: { shape: [[0,0,1],[1,1,1]], color: '#fa0' }
        };

        function newPiece() {
            const keys = Object.keys(tetrominos);
            const type = keys[Math.floor(Math.random()*keys.length)];
            const t = tetrominos[type];
            piece = {
                type: type,
                shape: t.shape.map(row => [...row]),
                x: Math.floor(cols/2) - Math.floor(t.shape[0].length/2),
                y: 0,
                color: t.color
            };
        }

        function draw() {
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Board
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(c*grid, r*grid, grid-1, grid-1);
                    }
                }
            }

            // Current piece
            if (piece) {
                ctx.fillStyle = piece.color;
                for (let r = 0; r < piece.shape.length; r++) {
                    for (let c = 0; c < piece.shape[r].length; c++) {
                        if (piece.shape[r][c]) {
                            ctx.fillRect((piece.x + c)*grid, (piece.y + r)*grid, grid-1, grid-1);
                        }
                    }
                }
            }
        }

        function collide() {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (!piece.shape[r][c]) continue;
                    const newX = piece.x + c;
                    const newY = piece.y + r;
                    if (newX < 0 || newX >= cols || newY >= rows) return true;
                    if (newY < 0) continue;
                    if (board[newY][newX]) return true;
                }
            }
            return false;
        }

        function merge() {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const y = piece.y + r;
                        if (y >= 0) board[y][piece.x + c] = piece.color;
                    }
                }
            }
        }

        function clearLines() {
            let lines = 0;
            for (let r = rows-1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(cols).fill(0));
                    lines++;
                    r++;
                }
            }
            if (lines) {
                score += [0, 100, 300, 500, 800][lines] * level;
                linesCleared += lines;
                level = Math.floor(linesCleared / 10) + 1;
                dropInterval = Math.max(100, 800 - (level-1)*70);
                document.getElementById('score').textContent = score;
                document.getElementById('level').textContent = level;
            }
        }

        function drop() {
            piece.y++;
            if (collide()) {
                piece.y--;
                merge();
                clearLines();
                newPiece();
                if (collide()) {
                    alert('Game Over ! Score: ' + score);
                    board = Array.from({length: rows}, () => Array(cols).fill(0));
                    score = 0; level = 1;
                    document.getElementById('score').textContent = 0;
                    document.getElementById('level').textContent = 1;
                }
            }
            lastDrop = Date.now();
        }

        function rotate() {
            const original = piece.shape;
            const n = original.length;
            const rotated = Array.from({length: n}, () => Array(n).fill(0));
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    rotated[j][n-1-i] = original[i][j];
                }
            }
            piece.shape = rotated;
            if (collide()) piece.shape = original;
        }

        function move(dir) {
            piece.x += dir;
            if (collide()) piece.x -= dir;
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (!piece) return;
            switch(e.key) {
                case 'ArrowLeft': move(-1); break;
                case 'ArrowRight': move(1); break;
                case 'ArrowDown': drop(); break;
                case 'ArrowUp': rotate(); break;
                case ' ': 
                    while (!collide({y: piece.y + 1})) piece.y++;
                    piece.y--; drop();
                    break;
            }
            draw();
        });

        // Touch swipe
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });

        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30) move(1);
                else if (diffX < -30) move(-1);
            } else {
                if (diffY > 30) drop();
                else if (diffY < -30) rotate();
            }
            draw();
        });

        // Buttons
        document.getElementById('left').addEventListener('click', () => { move(-1); draw(); });
        document.getElementById('right').addEventListener('click', () => { move(1); draw(); });
        document.getElementById('down').addEventListener('click', () => { drop(); draw(); });
        document.getElementById('rotate').addEventListener('click', () => { rotate(); draw(); });
        document.getElementById('harddrop').addEventListener('click', () => {
            while (!collide()) piece.y++;
            piece.y--; drop(); draw();
        });
        document.getElementById('pause').addEventListener('click', () => alert('Pause - Appuie sur OK pour reprendre'));
        document.getElementById('restart').addEventListener('click', () => location.reload());

        // Game loop
        function gameLoop() {
            const now = Date.now();
            if (now - lastDrop > dropInterval) drop();
            draw();
            requestAnimationFrame(gameLoop);
        }

        newPiece();
        gameLoop();
    </script>
</body>
</html>
