<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TETRIS NEON</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * { box-sizing: border-box; }
        body { 
            margin:0; padding:0; background:#0a001f; color:#0ff; font-family:'Press Start 2P', system-ui; 
            overflow:hidden; touch-action:none; height:100vh; 
        }
        #container { display:flex; flex-direction:column; height:100vh; }
        header { 
            text-align:center; padding:12px 8px; background:rgba(10,0,40,0.95); border-bottom:4px solid #0ff; 
            box-shadow: 0 0 20px #0ff;
        }
        h1 { 
            margin:0; font-size:2.2rem; text-shadow:0 0 15px #0ff, 0 0 30px #f0f; letter-spacing:4px;
        }
        .info { font-size:1.1rem; margin:6px 0; text-shadow:0 0 10px #0ff; }
        .game-area { 
            position:relative; flex:1; display:flex; align-items:center; justify-content:center; 
            background: linear-gradient(#111, #1a1a2e); padding:10px;
        }
        canvas { 
            image-rendering: pixelated; 
            box-shadow: 0 0 40px #0ff, 0 0 80px #f0f; 
            border:5px solid #0ff; border-radius:8px;
            max-width:100%; max-height: calc(100vh - 320px);
        }
        .next-box { 
            position:absolute; top:25px; right:25px; background:rgba(10,0,40,0.92); 
            padding:12px; border:3px solid #f0f; border-radius:12px; text-align:center; 
            box-shadow:0 0 25px #f0f; min-width:110px;
        }
        .controls { 
            display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:18px; 
            padding:30px 20px 40px; background:#0a001f; border-top:6px solid #0ff;
            box-shadow: 0 -10px 30px rgba(0,255,255,0.3);
        }
        button {
            background:rgba(0,255,255,0.25); color:#0ff; border:5px solid #0ff; border-radius:18px;
            font-size:2.2rem; padding:28px 12px; box-shadow:0 0 30px #0ff, 0 0 50px #f0f;
            font-family:'Press Start 2P', system-ui; min-height:85px; text-shadow:0 0 10px #000;
        }
        button:active {
            background:#0ff; color:#000; transform:scale(0.9); box-shadow:0 0 40px #0ff;
        }
        .harddrop { grid-column: span 4; font-size:1.6rem; padding:22px; }
        .action { font-size:1.4rem; }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>TETRIS</h1>
            <div class="info">Score: <span id="score">0</span> | Niveau: <span id="level">1</span></div>
        </header>
        
        <div class="game-area">
            <canvas id="board" width="300" height="600"></canvas>
            <div class="next-box">
                <div style="font-size:0.8rem; margin-bottom:6px;">NEXT</div>
                <canvas id="next" width="100" height="100"></canvas>
            </div>
        </div>

        <div class="controls">
            <button id="left">←</button>
            <button id="rotate">↻</button>
            <button id="right">→</button>
            <button id="down">↓</button>
            <button id="harddrop" class="harddrop">HARD DROP</button>
            <button id="pause" style="grid-column:span 2;" class="action">⏸ PAUSE</button>
            <button id="restart" style="grid-column:span 2;" class="action">RESTART</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('board');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextCtx = nextCanvas.getContext('2d');
        
        const COLS = 10, ROWS = 20, BLOCK = 30;
        let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
        let score = 0, level = 1, dropInterval = 650, lastDrop = Date.now();
        let currentPiece, nextPieceType;
        let gameOver = false, paused = false;

        const PIECES = [
            {shape: [[1,1,1,1]], color: '#00ffff'}, // I
            {shape: [[1,1],[1,1]], color: '#ffff00'}, // O
            {shape: [[0,1,0],[1,1,1]], color: '#ff00ff'}, // T
            {shape: [[0,1,1],[1,1,0]], color: '#00ff00'}, // S
            {shape: [[1,1,0],[0,1,1]], color: '#ff0000'}, // Z
            {shape: [[1,0,0],[1,1,1]], color: '#0066ff'}, // J
            {shape: [[0,0,1],[1,1,1]], color: '#ff8800'}  // L
        ];

        function randomPiece() {
            const p = PIECES[Math.floor(Math.random() * PIECES.length)];
            return {
                shape: p.shape.map(row => [...row]),
                color: p.color,
                x: Math.floor(COLS / 2) - 2,
                y: 0
            };
        }

        function drawBoard() {
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid lines
            ctx.strokeStyle = 'rgba(0,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * BLOCK, 0);
                ctx.lineTo(x * BLOCK, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * BLOCK);
                ctx.lineTo(canvas.width, y * BLOCK);
                ctx.stroke();
            }

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(c * BLOCK, r * BLOCK, BLOCK - 1, BLOCK - 1);
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(c * BLOCK + 2, r * BLOCK + 2, BLOCK - 5, BLOCK - 5);
                    }
                }
            }
        }

        function drawPiece(piece, context = ctx, offsetX = 0, offsetY = 0) {
            context.fillStyle = piece.color;
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        context.fillRect((piece.x + c + offsetX) * BLOCK, (piece.y + r + offsetY) * BLOCK, BLOCK - 2, BLOCK - 2);
                    }
                }
            }
        }

        function drawNext() {
            nextCtx.fillStyle = '#1a1a2e';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
            if (nextPieceType) {
                const temp = {...nextPieceType, x: 1, y: 1};
                drawPiece(temp, nextCtx, -1, 0);
            }
        }

        function collide(piece) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (!piece.shape[r][c]) continue;
                    const newX = piece.x + c;
                    const newY = piece.y + r;
                    if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
                    if (newY < 0) continue;
                    if (board[newY] && board[newY][newX]) return true;
                }
            }
            return false;
        }

        function merge() {
            for (let r = 0; r < currentPiece.shape.length; r++) {
                for (let c = 0; c < currentPiece.shape[r].length; c++) {
                    if (currentPiece.shape[r][c]) {
                        const y = currentPiece.y + r;
                        if (y >= 0) board[y][currentPiece.x + c] = currentPiece.color;
                    }
                }
            }
        }

        function clearLines() {
            let lines = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    lines++;
                    r++;
                }
            }
            if (lines > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[lines] * level;
                document.getElementById('score').textContent = score;
                level = Math.floor(score / 2500) + 1;
                dropInterval = Math.max(120, 700 - (level * 55));
                document.getElementById('level').textContent = level;
            }
        }

        function drop() {
            if (!currentPiece || gameOver || paused) return;
            currentPiece.y++;
            if (collide(currentPiece)) {
                currentPiece.y--;
                merge();
                clearLines();
                currentPiece = nextPieceType;
                nextPieceType = randomPiece();
                drawNext();
                if (collide(currentPiece)) {
                    gameOver = true;
                    alert('GAME OVER\n\nScore final : ' + score);
                }
            }
            lastDrop = Date.now();
        }

        function rotate() {
            if (!currentPiece) return;
            const originalShape = currentPiece.shape;
            const n = originalShape.length;
            const rotated = Array.from({length: n}, () => Array(n).fill(0));
            for (let i = 0; i < n; i++) {
                for (let j = 0; j < n; j++) {
                    rotated[j][n - 1 - i] = originalShape[i][j];
                }
            }
            currentPiece.shape = rotated;
            if (collide(currentPiece)) currentPiece.shape = originalShape;
        }

        function move(dir) {
            if (!currentPiece) return;
            currentPiece.x += dir;
            if (collide(currentPiece)) currentPiece.x -= dir;
        }

        // Event listeners
        document.getElementById('left').addEventListener('click', () => { move(-1); draw(); });
        document.getElementById('right').addEventListener('click', () => { move(1); draw(); });
        document.getElementById('down').addEventListener('click', () => { drop(); draw(); });
        document.getElementById('rotate').addEventListener('click', () => { rotate(); draw(); });
        document.getElementById('harddrop').addEventListener('click', () => {
            while (!collide(currentPiece)) currentPiece.y++;
            currentPiece.y--;
            drop();
            draw();
        });
        document.getElementById('pause').addEventListener('click', () => {
            paused = !paused;
        });
        document.getElementById('restart').addEventListener('click', () => location.reload());

        // Touch swipe
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        });
        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            const touchEndY = e.changedTouches[0].screenY;
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            if (Math.abs(diffX) > 40) {
                move(diffX > 0 ? 1 : -1);
            } else if (diffY > 50) {
                drop();
            } else if (diffY < -40) {
                rotate();
            }
            draw();
        });

        function draw() {
            drawBoard();
            if (currentPiece) drawPiece(currentPiece);
        }

        function gameLoop() {
            if (!paused && !gameOver) {
                if (Date.now() - lastDrop > dropInterval) {
                    drop();
                }
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Init
        function startGame() {
            nextPieceType = randomPiece();
            currentPiece = randomPiece();
            drawNext();
            gameLoop();
        }

        startGame();
    </script>
</body>
</html>
